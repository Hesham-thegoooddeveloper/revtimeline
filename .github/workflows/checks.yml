name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify formatting
        run: npx --yes prettier@3.9.9 --check "dist/*.mjs" dist/style.css "tests/*.mjs"
      - name: Verify module syntax
        run: for f in dist/*.mjs; do node --check "$f"; done
      - name: Verify dates, connections and summaries
        run: node --test tests/*.test.mjs
